# Custom fan curve for "nvfancontrol curve" / nvfancontrol-curve.service.
#
# The value written to the EC is a fan RPM *floor*: the EC automatic thermal
# curve still applies above it, so the curve can only make the fans faster.
# fan0 spans 1260-9000 RPM and fan1 spans 1890-13500 RPM; 9000 saturates fan0
# and 13500 (max) saturates both.

# Seconds between temperature readings.
INTERVAL=2

# Degrees C the temperature must fall below a step's threshold before the
# daemon steps down to the previous point.
HYSTERESIS=5

# Space-separated temperature sources; the hottest reading is used.
#   thermal     every /sys/class/thermal/thermal_zone*/temp
#   nvidia-smi  GPU temperature reported by nvidia-smi
#   /path       any file reporting millidegrees C
# If no source yields a reading, the daemon fails safe to max.
TEMP_SOURCE="thermal"

# Space-separated TEMP:TARGET steps with strictly increasing temperatures.
# TARGET is auto (EC curve only), max, or an RPM floor 0-13500. The step with
# the highest TEMP at or below the current temperature is applied.
#
#   <45 C     2000-3500 RPM   idle / low load
#   50-65 C   5500-7000 RPM   moderate load
#   70-80 C   9000 RPM        heavy load
#   >=85 C    13500 RPM       thermal critical (100%)
#
# Gaps between bands hold the lower band's top value.
CURVE="0:2000 40:3500 50:5500 58:6250 65:7000 70:9000 85:max"
